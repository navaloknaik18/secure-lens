
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureLens Interactive Test Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 30px;
            color: #172033;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #working-result,
        #broken-result,
        #form-result {
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>SecureLens AI Interactive Test Lab</h1>

    <p>This is a local demo website for functionality testing.</p>

    <section class="card">

        <h2>Working button</h2>

        <button
            type="button"
            data-securelens-test="safe-click"
            data-securelens-result="#working-result"
            data-securelens-expected="Button works"
            onclick="document.getElementById('working-result').textContent = 'Button works';"
        >
            Working button
        </button>

        <p id="working-result">Waiting for click...</p>

    </section>

    <section class="card">

        <h2>Non-working button</h2>

        <button
            type="button"
            data-securelens-test="safe-click"
            data-securelens-result="#broken-result"
            data-securelens-expected="Action completed"
        >
            Non-working button
        </button>

        <p id="broken-result">Waiting for click...</p>

    </section>

    <section class="card">

        <h2>Working form</h2>

        <form
            data-securelens-test="safe-submit"
            data-securelens-result="#form-result"
            data-securelens-expected="Form submitted successfully"
            onsubmit="
                event.preventDefault();
                document.getElementById('form-result').textContent =
                    'Form submitted successfully';
            "
        >

            <label for="username">Username</label>

            <input
                id="username"
                name="username"
                data-securelens-test-value="SecureLens Tester"
                required
            >

            <button
                type="submit"
                data-securelens-submit
            >
                Submit demo form
            </button>

        </form>

        <p id="form-result">Waiting for submission...</p>

    </section>

    <section class="card">

        <h2>Navigation</h2>

        <a href="#working-result">Go to working button result</a>

    </section>

</body>
</html>
